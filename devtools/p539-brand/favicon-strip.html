<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>favicon strip</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 34px; font-size: 12px; width: 260px; }
  .tab img { width: 16px; height: 16px; display: block; }
  .light { background: #dee1e6; color: #202124; }
  .dark { background: #202124; color: #e8eaed; }
  .wrap { display: flex; flex-direction: column; gap: 0; }
  .cap { padding: 8px 12px; font-size: 11px; color: #666; background: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tab light"><img src="/favicon.svg" alt="favicon"><span>青兔工具箱 · 管理后台</span></div>
    <div class="tab dark"><img src="/favicon.svg" alt="favicon"><span>青兔工具箱</span></div>
  </div>
</body>
</html>
